<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorridos · Museo Virtual</title>
  <meta name="description" content="Salas que forman cada visita guiada y su orden.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="recorridos">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <div id="site-header"></div>

  <header class="page-hero">
    <p class="eyebrow">Experiencias · Itinerarios</p>
    <h1>Recorridos</h1>
    <p class="lead">Define por qué salas pasa cada visita guiada y en qué orden.</p>
    <div class="ornament" aria-hidden="true">&#10086;</div>
  </header>

  <main id="contenido" class="container">
    <div class="tour-picker">
      <label class="field">
        <span>Visita guiada</span>
        <select id="tour-select" aria-label="Visita guiada"><option value="">Cargando…</option></select>
      </label>
    </div>

    <section id="tour-info" class="panel" hidden></section>

    <section aria-label="Salas del recorrido" id="route"></section>

    <form id="add-form" class="panel" hidden>
      <h2>Agregar sala al recorrido</h2>
      <div class="form-grid">
        <label class="field">
          <span>Sala</span>
          <select id="room-select" required></select>
        </label>
        <label class="field">
          <span>Posición (orden)</span>
          <input id="order-input" type="number" min="1" required>
        </label>
      </div>
      <p style="margin-top:1rem"><button id="add-btn" class="btn" type="submit">+ Agregar al recorrido</button></p>
    </form>
  </main>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
